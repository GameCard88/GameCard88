<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>บ้านเกมการ์ด ทันใจ — รับรหัสบัตรของคุณ</title>
  <meta property="og:title" content="บ้านเกมการ์ด ทันใจ">
  <meta property="og:description" content="รวดเร็วทันใจ มั่นใจทุกการ์ด — กดลิงก์เพื่อรับรหัสบัตรของคุณ">
  <meta property="og:image" content="https://gamecard88.github.io/og-image.png">
  <meta name="description" content="รวดเร็วทันใจ มั่นใจทุกการ์ด — กดลิงก์เพื่อรับรหัสบัตรของคุณ">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;background:#030817}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif;
      color:#f7fbff;-webkit-font-smoothing:antialiased;
      background:
        radial-gradient(600px 380px at 12% 4%,rgba(0,102,255,.22),transparent 65%),
        radial-gradient(600px 400px at 95% 30%,rgba(126,0,255,.18),transparent 68%),
        #030817;
      min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    body:before{
      content:"";position:fixed;inset:0;pointer-events:none;opacity:.25;
      background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:30px 30px;mask-image:linear-gradient(to bottom,black,transparent 80%);
    }
    .wrap{position:relative;z-index:1;text-align:center;padding:40px 24px}
    .brand{
      display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:800;
      letter-spacing:-.3px;margin-bottom:40px
    }
    .brand-icon{
      width:42px;height:42px;display:grid;place-items:center;border-radius:12px;font-size:20px;
      background:linear-gradient(135deg,#126eff,#8b2dff);box-shadow:0 0 24px rgba(33,139,255,.35)
    }
    .spinner{
      width:36px;height:36px;border:3px solid rgba(255,255,255,.08);
      border-top-color:#19bfff;border-right-color:#9b38ff;
      border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{font-size:13px;color:#8ea5c8;font-weight:500}
    .error-icon{font-size:44px;margin-bottom:12px;display:none}
    .error-title{font-size:16px;font-weight:700;color:#fff;margin-bottom:6px;display:none}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-icon">🎮</div>
    <span><em style="font-style:normal;color:#fff">บ้านเกมการ์ด</em> ทันใจ</span>
  </div>

  <div class="spinner" id="spinner"></div>
  <p class="msg" id="msg">กำลังโหลดรหัสบัตร...</p>
</div>
<script>
const GAS = 'https://script.google.com/macros/s/AKfycbxJA3MGl1s_gDoNcwe-BcxlqvdGEaA_NoMLDlEDdTQiw4fmKF6VdrlhljJeRgWW9mWzsw/exec';
const o   = new URLSearchParams(window.location.search).get('o') || '';
if (o) {
  window.location.replace(GAS + '?page=card&order=' + encodeURIComponent(o));
} else {
  // ไม่แสดง error — แสดงเป็นหน้า landing แทน
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('msg').textContent = 'กรุณาเปิดลิงก์จากข้อความที่ร้านค้าส่งให้';
}
</script>
</body>
</html>
